<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Teste Bluetooth micro:bit</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --texto: #e2e8f0;
    --suave: #94a3b8;
    --acento: #22c55e;
    --led-off: #334155;
    --led-on: #ef4444;
    --erro: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px; min-height: 100vh;
    background: var(--bg); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 0; }
  .card {
    width: 100%; max-width: 420px; background: var(--card);
    border-radius: 16px; padding: 16px;
  }
  button {
    font: inherit; color: var(--texto); background: #334155;
    border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button.principal { background: var(--acento); color: #052e16; font-weight: 700; width: 100%; padding: 16px; font-size: 1.05rem; }
  button.perigo { background: #7f1d1d; }
  button:disabled { opacity: .45; }
  #status { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .95rem; }
  #bolinha { width: 12px; height: 12px; border-radius: 50%; background: #64748b; flex: none; }
  #bolinha.on { background: var(--acento); box-shadow: 0 0 8px var(--acento); }
  #bolinha.busy { background: #facc15; }
  #grade {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    margin: 4px auto 0; width: 100%; max-width: 340px;
  }
  .led {
    aspect-ratio: 1; border-radius: 50%; background: var(--led-off);
    transition: background .08s, box-shadow .08s;
  }
  .led.on { background: var(--led-on); box-shadow: 0 0 14px var(--led-on); }
  .linha { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .linha button { flex: 1 1 auto; }
  label.auto { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--suave); font-size: .92rem; }
  label.auto input { width: 20px; height: 20px; }
  #aviso { color: var(--erro); font-size: .9rem; margin-top: 10px; display: none; line-height: 1.4; }
  #log {
    font: .78rem/1.4 ui-monospace, Menlo, monospace; color: var(--suave);
    max-height: 150px; overflow: auto; white-space: pre-wrap; margin: 0;
  }
  h2 { font-size: .95rem; margin: 0 0 8px; color: var(--suave); font-weight: 600; }
</style>
</head>
<body>

<h1>🔵 Teste Bluetooth – micro:bit V2</h1>

<div class="card">
  <button id="btnConectar" class="principal">Conectar à micro:bit</button>
  <div id="status"><span id="bolinha"></span><span id="textoStatus">Desconectado</span></div>
  <div id="aviso"></div>
</div>

<div class="card">
  <h2>Toque ou arraste para acender/apagar</h2>
  <div id="grade"></div>

  <label class="auto">
    <input type="checkbox" id="auto" checked>
    Enviar automaticamente a cada toque
  </label>

  <div class="linha">
    <button id="btnEnviar">Enviar agora</button>
    <button id="btnLimpar" class="perigo">Limpar</button>
    <button id="btnTudo">Acender tudo</button>
    <button id="btnInverter">Inverter</button>
  </div>
</div>

<div class="card">
  <h2>Desenhos prontos</h2>
  <div class="linha" id="presets"></div>
</div>

<div class="card">
  <h2>Registro</h2>
  <pre id="log"></pre>
</div>

<script>
// ===== UUIDs oficiais do serviço de LED da micro:bit =====
const LED_SERVICE = 'e95dd91d-251d-470a-a062-fa1922dfa9a8';
const LED_MATRIX  = 'e95d7b77-251d-470a-a062-fa1922dfa9a8';

// Se a imagem aparecer espelhada na micro:bit, troque para true
const ESPELHAR = false;

const N = 5;
let estado = Array.from({ length: N }, () => Array(N).fill(false));
let dispositivo = null;
let caracteristica = null;

const $ = id => document.getElementById(id);
const grade = $('grade');
const celulas = [];

function log(msg) {
  const hora = new Date().toLocaleTimeString('pt-BR');
  $('log').textContent += `[${hora}] ${msg}\n`;
  $('log').scrollTop = $('log').scrollHeight;
}

function setStatus(texto, modo) {
  $('textoStatus').textContent = texto;
  $('bolinha').className = modo || '';
}

// ===== Grade =====
for (let y = 0; y < N; y++) {
  for (let x = 0; x < N; x++) {
    const d = document.createElement('div');
    d.className = 'led';
    d.dataset.x = x; d.dataset.y = y;
    grade.appendChild(d);
    celulas.push(d);
  }
}

function desenhar() {
  celulas.forEach(c => {
    c.classList.toggle('on', estado[+c.dataset.y][+c.dataset.x]);
  });
}

let pintando = false, valorPintura = true;

function celulaNoPonto(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el && el.classList.contains('led') ? el : null;
}

grade.addEventListener('pointerdown', e => {
  const c = celulaNoPonto(e);
  if (!c) return;
  e.preventDefault();
  pintando = true;
  valorPintura = !estado[+c.dataset.y][+c.dataset.x];
  estado[+c.dataset.y][+c.dataset.x] = valorPintura;
  desenhar();
  if ($('auto').checked) enviar();
});
grade.addEventListener('pointermove', e => {
  if (!pintando) return;
  const c = celulaNoPonto(e);
  if (!c) return;
  const x = +c.dataset.x, y = +c.dataset.y;
  if (estado[y][x] !== valorPintura) {
    estado[y][x] = valorPintura;
    desenhar();
    if ($('auto').checked) enviar();
  }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  grade.addEventListener(ev, () => { pintando = false; }));

// ===== Desenhos prontos =====
const PRESETS = {
  '❤️ Coração': ['01010','11111','11111','01110','00100'],
  '🙂 Rosto':   ['01010','01010','00000','10001','01110'],
  '⬆️ Seta':    ['00100','01110','10101','00100','00100'],
  '✖️ X':       ['10001','01010','00100','01010','10001'],
  '⬛ Quadrado':['11111','10001','10001','10001','11111'],
  '⭐ Estrela': ['00100','00100','11111','01110','10001']
};
Object.entries(PRESETS).forEach(([nome, linhas]) => {
  const b = document.createElement('button');
  b.textContent = nome;
  b.onclick = () => {
    estado = linhas.map(l => [...l].map(ch => ch === '1'));
    desenhar();
    enviar();
  };
  $('presets').appendChild(b);
});

$('btnLimpar').onclick = () => { estado = estado.map(l => l.map(() => false)); desenhar(); enviar(); };
$('btnTudo').onclick = () => { estado = estado.map(l => l.map(() => true)); desenhar(); enviar(); };
$('btnInverter').onclick = () => { estado = estado.map(l => l.map(v => !v)); desenhar(); enviar(); };
$('btnEnviar').onclick = () => enviar(true);

// ===== Converter para 5 bytes (um por linha, 5 bits) =====
function paraBytes() {
  const bytes = new Uint8Array(5);
  for (let y = 0; y < N; y++) {
    let v = 0;
    for (let x = 0; x < N; x++) {
      if (estado[y][x]) {
        const bit = ESPELHAR ? (1 << x) : (0x10 >> x);
        v |= bit;
      }
    }
    bytes[y] = v;
  }
  return bytes;
}

// ===== Envio (com fila, para evitar "GATT operation already in progress") =====
let enviando = false, pendente = false;

async function enviar(manual) {
  if (!caracteristica) {
    if (manual) log('Conecte à micro:bit primeiro.');
    return;
  }
  if (enviando) { pendente = true; return; }
  enviando = true;
  try {
    do {
      pendente = false;
      const bytes = paraBytes();
      await caracteristica.writeValue(bytes);
      log('Enviado: ' + [...bytes].map(b => b.toString(2).padStart(5, '0')).join(' '));
    } while (pendente);
  } catch (err) {
    log('Erro ao enviar: ' + err.message);
    setStatus('Erro ao enviar', 'busy');
  } finally {
    enviando = false;
  }
}

// ===== Conexão =====
function aoDesconectar() {
  caracteristica = null;
  $('btnConectar').textContent = 'Conectar à micro:bit';
  setStatus('Desconectado', '');
  log('Desconectado.');
}

async function conectar() {
  if (dispositivo && dispositivo.gatt.connected) {
    dispositivo.gatt.disconnect();
    return;
  }
  try {
    setStatus('Procurando dispositivo…', 'busy');
    log('Abrindo seletor Bluetooth…');
    dispositivo = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'BBC micro:bit' }],
      optionalServices: [LED_SERVICE]
    });
    log('Selecionado: ' + dispositivo.name);
    dispositivo.addEventListener('gattserverdisconnected', aoDesconectar);

    setStatus('Conectando…', 'busy');
    const servidor = await dispositivo.gatt.connect();
    log('GATT conectado.');

    const servico = await servidor.getPrimaryService(LED_SERVICE);
    log('Serviço de LED encontrado.');
    caracteristica = await servico.getCharacteristic(LED_MATRIX);
    log('Característica da matriz encontrada.');

    setStatus('Conectado a ' + dispositivo.name, 'on');
    $('btnConectar').textContent = 'Desconectar';
    await enviar(); // sincroniza o desenho atual
  } catch (err) {
    log('Falhou: ' + err.name + ' – ' + err.message);
    if (err.name === 'NotFoundError' && /service/i.test(err.message)) {
      log('Dica: o programa na micro:bit precisa ter o serviço de LED Bluetooth ativo.');
    }
    setStatus(err.name === 'NotFoundError' && !/service/i.test(err.message) ? 'Nenhum dispositivo escolhido' : 'Falha na conexão', '');
  }
}
$('btnConectar').onclick = conectar;

// ===== Verificação de suporte =====
if (!navigator.bluetooth) {
  $('btnConectar').disabled = true;
  const a = $('aviso');
  a.style.display = 'block';
  a.innerHTML = 'Este navegador não suporta Web Bluetooth. No Android use o <b>Chrome</b>; ' +
    'no iPhone/iPad use um navegador como o <b>Bluefy</b> (o Safari e o Chrome do iOS não suportam). ' +
    'A página também precisa estar em <b>HTTPS</b>.';
  setStatus('Web Bluetooth indisponível', '');
  log('navigator.bluetooth indisponível. HTTPS? ' + window.isSecureContext);
}

desenhar();
log('Pronto. Toque em "Conectar à micro:bit".');
</script>
</body>
</html>
