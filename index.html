<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matriz micro:bit</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --suave:#94a3b8; --ok:#22c55e; --off:#334155; --on:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; min-height:100vh; background:var(--bg); color:var(--txt);
         font-family:system-ui,-apple-system,Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; gap:14px; }
  h1 { font-size:1.2rem; margin:4px 0 0; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:16px; padding:16px; }
  button { font:inherit; color:var(--txt); background:#334155; border:0; border-radius:12px; padding:12px 14px; touch-action:manipulation; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.45; }
  .principal { width:100%; padding:16px; font-size:1.05rem; font-weight:700; background:var(--ok); color:#052e16; }
  #status { display:flex; align-items:center; gap:8px; margin-top:12px; }
  #dot { width:12px; height:12px; border-radius:50%; background:#64748b; }
  #dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #dot.busy { background:#facc15; }
  #grade { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-width:340px; margin:0 auto;
           touch-action:none; user-select:none; -webkit-user-select:none; }
  .led { aspect-ratio:1; border-radius:50%; background:var(--off); }
  .led.on { background:var(--on); box-shadow:0 0 14px var(--on); }
  .linha { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .linha button { flex:1 1 auto; }
  #aviso { display:none; color:#f87171; font-size:.9rem; margin-top:10px; line-height:1.4; }
  pre { margin:0; font:.78rem/1.4 ui-monospace,monospace; color:var(--suave); max-height:160px; overflow:auto; white-space:pre-wrap; }
  h2 { font-size:.9rem; margin:0 0 8px; color:var(--suave); }
</style>
</head>
<body>
<h1>Matriz de LEDs – micro:bit</h1>

<div class="card">
  <button id="btnConectar" class="principal">Conectar</button>
  <div id="status"><span id="dot"></span><span id="txtStatus">Desconectado</span></div>
  <div id="aviso"></div>
</div>

<div class="card">
  <div id="grade"></div>
  <div class="linha">
    <button id="btnLimpar">Limpar</button>
    <button id="btnTudo">Acender tudo</button>
    <button id="btnInverter">Inverter</button>
  </div>
  <div class="linha" id="presets"></div>
</div>

<div class="card"><h2>Registro</h2><pre id="log"></pre></div>

<script>
const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // celular escreve aqui
const CODIGO       = '0123456789ABCDEFGHIJKLMNOPQRSTUV';      // 1 caractere = 1 linha (0..31)

const $ = id => document.getElementById(id);
const log = m => { const p = $('log'); p.textContent += new Date().toLocaleTimeString('pt-BR') + '  ' + m + '\n'; p.scrollTop = p.scrollHeight; };
const setStatus = (t, c) => { $('txtStatus').textContent = t; $('dot').className = c || ''; };

let estado = Array.from({length:5}, () => Array(5).fill(false));
let dispositivo = null, rx = null;

// ----- grade -----
const grade = $('grade'), celulas = [];
for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
  const d = document.createElement('div'); d.className = 'led'; d.dataset.x = x; d.dataset.y = y;
  grade.appendChild(d); celulas.push(d);
}
const desenhar = () => celulas.forEach(c => c.classList.toggle('on', estado[+c.dataset.y][+c.dataset.x]));

let pintando = false, valor = true;
const celulaEm = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.classList.contains('led') ? el : null; };
grade.addEventListener('pointerdown', e => {
  const c = celulaEm(e); if (!c) return; e.preventDefault();
  pintando = true; valor = !estado[+c.dataset.y][+c.dataset.x];
  estado[+c.dataset.y][+c.dataset.x] = valor; desenhar(); enviar();
});
grade.addEventListener('pointermove', e => {
  if (!pintando) return; const c = celulaEm(e); if (!c) return;
  const x = +c.dataset.x, y = +c.dataset.y;
  if (estado[y][x] !== valor) { estado[y][x] = valor; desenhar(); enviar(); }
});
['pointerup','pointercancel'].forEach(ev => window.addEventListener(ev, () => pintando = false));

// ----- botões / desenhos -----
const PRESETS = {
  '❤️':['01010','11111','11111','01110','00100'], '🙂':['01010','01010','00000','10001','01110'],
  '⬆️':['00100','01110','10101','00100','00100'], '✖️':['10001','01010','00100','01010','10001'],
  '⬛':['11111','10001','10001','10001','11111'], '⭐':['00100','00100','11111','01110','10001']
};
for (const [nome, ls] of Object.entries(PRESETS)) {
  const b = document.createElement('button'); b.textContent = nome; b.style.fontSize = '1.4rem';
  b.onclick = () => { estado = ls.map(l => [...l].map(c => c === '1')); desenhar(); enviar(); };
  $('presets').appendChild(b);
}
$('btnLimpar').onclick   = () => { estado = estado.map(l => l.map(() => false)); desenhar(); enviar(); };
$('btnTudo').onclick     = () => { estado = estado.map(l => l.map(() => true));  desenhar(); enviar(); };
$('btnInverter').onclick = () => { estado = estado.map(l => l.map(v => !v));     desenhar(); enviar(); };

// ----- mensagem curta: "m" + 5 caracteres (um por linha) + quebra de linha -----
function mensagem() {
  let s = 'm';
  for (let y = 0; y < 5; y++) {
    let v = 0;
    for (let x = 0; x < 5; x++) if (estado[y][x]) v |= 16 >> x;
    s += CODIGO[v];
  }
  return s + '\n';
}

let enviando = false, pendente = false;
async function enviar() {
  if (!rx) return;
  if (enviando) { pendente = true; return; }
  enviando = true;
  try {
    do {
      pendente = false;
      const msg = mensagem();
      await rx.writeValue(new TextEncoder().encode(msg));
      log('enviado: ' + msg.trim());
    } while (pendente);
  } catch (e) { log('erro ao enviar: ' + e.message); }
  enviando = false;
}

// ----- conexão -----
function aoDesconectar() { rx = null; $('btnConectar').textContent = 'Conectar'; setStatus('Desconectado'); log('desconectado'); }

$('btnConectar').onclick = async () => {
  if (dispositivo && dispositivo.gatt.connected) { dispositivo.gatt.disconnect(); return; }
  try {
    setStatus('Procurando…', 'busy');
    // Aceita qualquer dispositivo que se chame "BBC micro:bit" OU que ofereça o serviço UART
    dispositivo = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'BBC micro:bit' }, { services: [UART_SERVICE] }],
      optionalServices: [UART_SERVICE]
    });
    log('escolhido: ' + (dispositivo.name || '(sem nome)'));
    dispositivo.addEventListener('gattserverdisconnected', aoDesconectar);
    setStatus('Conectando…', 'busy');
    const srv = await dispositivo.gatt.connect();
    const svc = await srv.getPrimaryService(UART_SERVICE);
    rx = await svc.getCharacteristic(UART_RX);
    setStatus('Conectado: ' + (dispositivo.name || 'micro:bit'), 'on');
    $('btnConectar').textContent = 'Desconectar';
    log('UART pronto');
    enviar();
  } catch (e) {
    log('falhou: ' + e.name + ' - ' + e.message);
    setStatus(e.name === 'NotFoundError' ? 'Nada escolhido / não encontrado' : 'Falha na conexão');
  }
};

if (!navigator.bluetooth) {
  $('btnConectar').disabled = true;
  $('aviso').style.display = 'block';
  $('aviso').innerHTML = 'Sem Web Bluetooth. Use o <b>Chrome no Android</b> (no iPhone, o app <b>Bluefy</b>) e abra a página em <b>HTTPS</b>.';
  setStatus('Web Bluetooth indisponível');
}
desenhar();
log('pronto');
</script>
</body>
</html>
